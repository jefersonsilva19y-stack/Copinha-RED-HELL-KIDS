<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal do Organizador | Copinha Red Hell</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">RH</span><span><strong>PORTAL</strong><small>ORGANIZADOR</small></span></a><button id="logout" class="btn btn-ghost">Sair</button></header>
<main class="section"><div class="container">
<div id="login"><span class="section-kicker">ACESSO RESTRITO</span><h2>Portal do<br><em>organizador</em></h2><form id="loginForm" class="registration-form" style="max-width:480px"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button class="btn btn-primary full">Entrar</button><div id="loginMsg" class="form-message"></div></form></div>
<div id="dashboard" hidden><div class="section-head"><div><span class="section-kicker">INSCRIÇÕES</span><h2>Atletas cadastrados</h2></div><button id="refresh" class="btn btn-primary">Atualizar</button></div><div class="info-card" style="overflow:auto"><div id="stats" style="margin-bottom:20px"></div><table id="table" style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>Protocolo</th><th>Atleta</th><th>Academia</th><th>Faixa</th><th>Peso</th><th>Responsável</th><th>Status</th><th>Pagamento</th><th>Ação</th></tr></thead><tbody></tbody></table></div></div>
</div></main>
<script>
const login=document.getElementById("login"),dash=document.getElementById("dashboard"),lm=document.getElementById("loginMsg");
async function load(){
 const {data,error}=await supabaseClient.from("registrations").select("*").order("created_at",{ascending:false});
 if(error){document.querySelector("#stats").textContent="Erro ao carregar inscrições.";return;}
 document.querySelector("#stats").textContent=data.length+" inscrição(ões)";
 document.querySelector("#table tbody").innerHTML=data.map(r=>{
  const confirmed=r.payment_status==="Confirmado";
  return '<tr><td>'+r.protocol+'</td><td>'+r.athlete_name+'</td><td>'+r.academy+'</td><td>'+r.belt+'</td><td>'+(r.weight_kg||"—")+' kg</td><td>'+r.responsible_name+'<br>'+r.responsible_phone+'</td><td>'+r.registration_status+'</td><td>'+r.payment_status+'</td><td style="white-space:nowrap">'+(
   confirmed ? '<span>✅ Confirmado</span>' :
   '<button type="button" class="btn btn-primary confirm-payment" data-id="'+r.id+'" style="padding:8px 12px;font-size:12px;margin-right:6px">Confirmar</button><button type="button" class="btn btn-ghost delete-registration" data-id="'+r.id+'" style="padding:8px 12px;font-size:12px">Excluir</button>'
  )+'</td></tr>';
 }).join("");
}
document.querySelector("#table tbody").addEventListener("click",async e=>{
 const confirmBtn=e.target.closest(".confirm-payment");
 if(confirmBtn){
  if(!confirm("Confirmar o pagamento desta inscrição?"))return;
  confirmBtn.disabled=true; confirmBtn.textContent="Confirmando...";
  const {error}=await supabaseClient.from("registrations").update({payment_status:"Confirmado"}).eq("id",confirmBtn.dataset.id);
  if(error){confirmBtn.disabled=false;confirmBtn.textContent="Confirmar";alert("Não foi possível confirmar o pagamento.");return;}
  await load(); return;
 }
 const deleteBtn=e.target.closest(".delete-registration");
 if(deleteBtn){
  if(!confirm("Excluir definitivamente esta inscrição porque o pagamento não foi realizado?"))return;
  deleteBtn.disabled=true; deleteBtn.textContent="Excluindo...";
  const {error}=await supabaseClient.from("registrations").delete().eq("id",deleteBtn.dataset.id);
  if(error){deleteBtn.disabled=false;deleteBtn.textContent="Excluir";alert("Não foi possível excluir a inscrição.");return;}
  await load();
 }
});
async function check(){const {data:{session}}=await supabaseClient.auth.getSession();if(session){const {data:org}=await supabaseClient.from("organizers").select("user_id").eq("user_id",session.user.id).maybeSingle();if(org){login.hidden=true;dash.hidden=false;await load();return;}}login.hidden=false;dash.hidden=true}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();lm.className="form-message show";const loginEmail=document.getElementById("email").value.trim();const loginPassword=document.getElementById("password").value;const {error}=await supabaseClient.auth.signInWithPassword({email:loginEmail,password:loginPassword});if(error){console.error(error);lm.textContent="E-mail ou senha inválidos.";return}check()});
document.getElementById("logout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();check()});document.getElementById("refresh").addEventListener("click",load);check();
</script></body></html>
